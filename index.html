<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<title>사회 3단원 · 기말퀴즈</title>
<style>
  :root {
    --bg:#1E2026; --bg2:#2B2F36; --bg3:#252930;
    --y:#F0B90B; --yd:rgba(240,185,11,0.22); --yb:rgba(240,185,11,0.13);
    --t1:#EAECEF; --t2:#848E9C;
    --bd:rgba(234,236,239,0.08); --by:rgba(240,185,11,0.18);
    --green:#0ECB81; --greenbg:rgba(14,203,129,0.12);
    --red:#F6465D; --redbg:rgba(246,70,93,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:var(--bg); color:var(--t1);
    font-size:16px; line-height:1.85;
    padding:18px 15px 60px;
    max-width:680px; margin:0 auto;
  }

  /* 표지 */
  .cover{
    background:var(--bg2); border:1px solid var(--by);
    border-radius:10px; padding:22px 18px 18px;
    margin-bottom:14px; position:relative; overflow:hidden;
  }
  .cover::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--y);}
  .cv-sub{font-size:12px;color:var(--t2);letter-spacing:.08em;margin-bottom:5px;}
  .cv-main{font-size:22px;font-weight:700;}
  .cv-tag{display:inline-block;background:var(--yb);color:var(--y);font-size:12px;font-weight:500;padding:2px 10px;border-radius:20px;border:1px solid var(--by);margin-top:7px;}

  /* 진행도 */
  .progress-wrap{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);margin-bottom:8px;}
  .progress-bar-bg{background:var(--bg3);border-radius:99px;height:8px;overflow:hidden;}
  .progress-bar{background:var(--y);height:100%;border-radius:99px;transition:width 0.4s ease;width:0%;}
  .score-display{text-align:center;font-size:13px;color:var(--t2);margin-top:8px;}
  .score-display span{color:var(--y);font-weight:700;font-size:15px;}

  /* 퀴즈 카드 */
  .quiz-card{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;margin-bottom:14px;overflow:hidden;}
  .qh{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--bg3);border-bottom:1px solid var(--bd);}
  .qnum{background:var(--y);color:#1E2026;font-weight:700;font-size:12px;min-width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .qtype{font-size:11px;color:var(--t2);background:var(--bg2);padding:2px 8px;border-radius:20px;border:1px solid var(--bd);margin-left:auto;}
  .qt{font-size:14.5px;font-weight:700;}
  .qbody{padding:15px 16px;}
  .qtext{font-size:15px;line-height:1.9;margin-bottom:12px;}
  .qbox-inner{background:rgba(240,185,11,0.05);border:1px solid var(--by);border-radius:5px;padding:11px 13px;font-size:14.5px;line-height:1.85;margin-bottom:12px;}

  /* 객관식 */
  .options{display:flex;flex-direction:column;gap:8px;}
  .opt-btn{
    background:var(--bg3);border:1px solid var(--bd);border-radius:8px;
    padding:10px 14px;font-size:14.5px;color:var(--t1);cursor:pointer;
    text-align:left;transition:all 0.18s;font-family:'Noto Sans KR',sans-serif;line-height:1.7;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--y);background:var(--yb);}
  .opt-btn.correct{background:var(--greenbg);border-color:var(--green);color:var(--green);}
  .opt-btn.wrong{background:var(--redbg);border-color:var(--red);color:var(--red);}
  .opt-btn.reveal{background:var(--greenbg);border-color:var(--green);color:var(--green);}
  .opt-btn:disabled{cursor:default;}

  /* OX */
  .ox-wrap{display:flex;gap:12px;}
  .ox-btn{
    flex:1;padding:14px;border-radius:8px;font-size:22px;font-weight:700;
    border:1px solid var(--bd);background:var(--bg3);cursor:pointer;
    transition:all 0.18s;font-family:'Noto Sans KR',sans-serif;color:var(--t1);
  }
  .ox-btn:hover:not(:disabled){border-color:var(--y);background:var(--yb);}
  .ox-btn.correct{background:var(--greenbg);border-color:var(--green);color:var(--green);}
  .ox-btn.wrong{background:var(--redbg);border-color:var(--red);color:var(--red);}
  .ox-btn.reveal{background:var(--greenbg);border-color:var(--green);color:var(--green);}
  .ox-btn:disabled{cursor:default;}

  /* 단답형 */
  .short-wrap{display:flex;gap:8px;}
  .short-input{
    flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;
    padding:10px 14px;font-size:15px;color:var(--t1);font-family:'Noto Sans KR',sans-serif;
    outline:none;transition:border-color 0.18s;
  }
  .short-input:focus{border-color:var(--y);}
  .short-input.correct{border-color:var(--green);background:var(--greenbg);}
  .short-input.wrong{border-color:var(--red);background:var(--redbg);}
  .submit-btn{
    background:var(--y);color:#1E2026;border:none;border-radius:8px;
    padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;white-space:nowrap;
  }
  .submit-btn:disabled{opacity:0.4;cursor:default;}

  /* 해설 */
  .explanation{
    display:none;margin-top:12px;
    background:rgba(240,185,11,0.06);border-left:3px solid var(--y);
    border-radius:0 6px 6px 0;padding:10px 13px;
    font-size:14px;line-height:1.8;color:var(--t1);
  }
  .explanation.show{display:block;}
  .exp-label{font-size:12px;color:var(--y);font-weight:700;margin-bottom:4px;}

  /* 다음 버튼 */
  .next-btn{
    display:none;width:100%;margin-top:12px;
    background:var(--y);color:#1E2026;border:none;border-radius:8px;
    padding:12px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;transition:opacity 0.18s;
  }
  .next-btn:hover{opacity:0.88;}
  .next-btn.show{display:block;}

  /* 결과 */
  .result-screen{
    display:none;background:var(--bg2);border:1px solid var(--by);
    border-radius:10px;padding:28px 20px;text-align:center;
    position:relative;overflow:hidden;
  }
  .result-screen::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--y);}
  .result-screen.show{display:block;}
  .result-emoji{font-size:48px;margin-bottom:12px;}
  .result-title{font-size:20px;font-weight:700;margin-bottom:6px;}
  .result-score{font-size:36px;font-weight:700;color:var(--y);margin-bottom:6px;}
  .result-sub{font-size:14px;color:var(--t2);margin-bottom:20px;}
  .result-grade{display:inline-block;background:var(--yb);color:var(--y);border:1px solid var(--by);border-radius:20px;padding:4px 16px;font-size:14px;font-weight:700;margin-bottom:20px;}
  .review-list{text-align:left;margin-bottom:20px;}
  .review-title{font-size:13px;color:var(--t2);margin-bottom:10px;font-weight:500;}
  .review-item{background:var(--bg3);border-radius:8px;padding:10px 13px;font-size:14px;line-height:1.7;margin-bottom:8px;border-left:3px solid var(--red);}
  .review-item-q{color:var(--t2);font-size:13px;margin-bottom:3px;}
  .review-item-a{color:var(--green);font-size:13px;}
  .restart-btn{background:var(--y);color:#1E2026;border:none;border-radius:8px;padding:13px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

  .shuffle-badge{display:inline-flex;align-items:center;gap:5px;background:var(--yb);color:var(--y);font-size:12px;font-weight:500;padding:2px 10px;border-radius:20px;border:1px solid var(--by);margin-top:7px;margin-left:6px;}

  #quiz-container .quiz-card:last-child{margin-bottom:0;}
</style>
</head>
<body>

<div class="cover">
  <div class="cv-sub">사회 3단원 · 기말고사 퀴즈</div>
  <div class="cv-main">경제 생활과 선택</div>
  <div>
    <span class="cv-tag">2026 기말고사</span>
    <span class="shuffle-badge" id="shuffle-badge" style="display:none;">🔀 랜덤 모드</span>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span>진행도</span>
    <span id="prog-text">0 / 20</span>
  </div>
  <div class="progress-bar-bg"><div class="progress-bar" id="prog-bar"></div></div>
  <div class="score-display">현재 점수: <span id="score-now">0</span>점 / <span id="score-total">0</span>점</div>
</div>

<div id="quiz-container"></div>
<div class="result-screen" id="result">
  <div class="result-emoji" id="res-emoji">🎉</div>
  <div class="result-title" id="res-title"></div>
  <div class="result-score" id="res-score"></div>
  <div class="result-sub">총 20문제</div>
  <div class="result-grade" id="res-grade"></div>
  <div class="review-list" id="review-list"></div>
  <button class="restart-btn" onclick="restartQuiz()">🔀 섞어서 다시 풀기</button>
</div>

// ── 상태 변수 ────────────────────────────────────────────────
let queue = [];       // 현재 출제 순서 (셔플된 배열)
let currentIdx = 0;   // 현재 문제 인덱스
let score = 0;
let answered = 0;
let wrongList = [];
let isFirstRound = true;

// ── 유틸 ─────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function typeLabel(type) {
  return { mc: '객관식', ox: 'O / X', short: '단답형' }[type] || '';
}

// ── 렌더링 ───────────────────────────────────────────────────
function renderQuestion(q, displayNum) {
  const card = document.createElement('div');
  card.className = 'quiz-card';
  card.id = 'qcard-' + q.id;

  let bodyHTML = '';

  // 본문
  if (q.type === 'mc') {
    const ctx = q.context ? `<div class="qbox-inner">${q.context}</div>` : '';
    const opts = q.options.map((o, i) =>
      `<button class="opt-btn" data-qid="${q.id}" data-correct="${o.correct}" onclick="handleMC(this)">${o.text}</button>`
    ).join('');
    bodyHTML = `
      <div class="qtext">${q.question}</div>
      ${ctx}
      <div class="options">${opts}</div>`;
  } else if (q.type === 'ox') {
    bodyHTML = `
      <div class="qtext">다음 설명이 맞으면 O, 틀리면 X를 선택하세요.</div>
      <div class="qbox-inner">${q.statement}</div>
      <div class="ox-wrap">
        <button class="ox-btn" data-qid="${q.id}" data-val="true" onclick="handleOX(this)">O</button>
        <button class="ox-btn" data-qid="${q.id}" data-val="false" onclick="handleOX(this)">X</button>
      </div>`;
  } else if (q.type === 'short') {
    bodyHTML = `
      <div class="qtext">${q.question}</div>
      <div class="short-wrap">
        <input class="short-input" id="inp-${q.id}" type="text" placeholder="답을 입력하세요"
          onkeydown="if(event.key==='Enter') handleShort(${q.id})">
        <button class="submit-btn" id="sub-${q.id}" onclick="handleShort(${q.id})">확인</button>
      </div>`;
  }

  card.innerHTML = `
    <div class="qh">
      <div class="qnum">${displayNum}</div>
      <div class="qt">${q.title}</div>
      <div class="qtype">${typeLabel(q.type)}</div>
    </div>
    <div class="qbody">
      ${bodyHTML}
      <div class="explanation" id="exp-${q.id}">
        <div class="exp-label">💡 해설</div>
        ${q.explanation}
      </div>
      <button class="next-btn" id="next-${q.id}" onclick="goNext()">
        ${currentIdx + 1 >= queue.length ? '결과 보기 🎯' : '다음 문제 →'}
      </button>
    </div>`;

  return card;
}

function showCurrentQuestion() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  if (currentIdx >= queue.length) { showResult(); return; }

  const q = queue[currentIdx];
  const card = renderQuestion(q, currentIdx + 1);
  container.appendChild(card);

  // 다음 버튼 텍스트 업데이트
  const nextBtn = document.getElementById('next-' + q.id);
  if (nextBtn) {
    nextBtn.textContent = currentIdx + 1 >= queue.length ? '결과 보기 🎯' : '다음 문제 →';
  }
}

// ── 정답 처리 ─────────────────────────────────────────────────
function afterAnswer(qid, isCorrect) {
  answered++;
  if (isCorrect) score++;
  else {
    const q = queue.find(x => x.id === qid);
    wrongList.push({ title: q.title, answerLabel: q.answerLabel });
  }
  document.getElementById('exp-' + qid).classList.add('show');
  const nb = document.getElementById('next-' + qid);
  nb.classList.add('show');
  updateProgress();
}

function handleMC(btn) {
  const qid = parseInt(btn.dataset.qid);
  const isCorrect = btn.dataset.correct === 'true';
  const card = document.getElementById('qcard-' + qid);
  card.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === 'true') b.classList.add('reveal');
  });
  btn.classList.remove('reveal');
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  afterAnswer(qid, isCorrect);
}

function handleOX(btn) {
  const qid = parseInt(btn.dataset.qid);
  const q = queue.find(x => x.id === qid);
  const selected = btn.dataset.val === 'true';
  const isCorrect = selected === q.correct;
  const card = document.getElementById('qcard-' + qid);
  card.querySelectorAll('.ox-btn').forEach(b => {
    b.disabled = true;
    if ((b.dataset.val === 'true') === q.correct) b.classList.add('reveal');
  });
  btn.classList.remove('reveal');
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  afterAnswer(qid, isCorrect);
}

function handleShort(qid) {
  const q = queue.find(x => x.id === qid);
  const inp = document.getElementById('inp-' + qid);
  const sub = document.getElementById('sub-' + qid);
  const val = inp.value.trim();
  if (!val) return;
  inp.disabled = true;
  sub.disabled = true;

  let isCorrect;
  if (q.multiKeyword) {
    isCorrect = q.answers.every(kw => val.includes(kw));
  } else {
    isCorrect = q.answers.some(a => val === a || val.includes(a) || a.includes(val));
  }
  inp.classList.add(isCorrect ? 'correct' : 'wrong');
  afterAnswer(qid, isCorrect);
}

function goNext() {
  currentIdx++;
  if (currentIdx >= queue.length) { showResult(); return; }
  showCurrentQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── 진행도 ────────────────────────────────────────────────────
function updateProgress() {
  const pct = (answered / queue.length) * 100;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-text').textContent = answered + ' / ' + queue.length;
  document.getElementById('score-now').textContent = score;
  document.getElementById('score-total').textContent = answered;
}

// ── 결과 ─────────────────────────────────────────────────────
function showResult() {
  document.getElementById('quiz-container').innerHTML = '';
  const res = document.getElementById('result');
  res.classList.add('show');

  const pct = Math.round((score / queue.length) * 100);
  document.getElementById('res-score').textContent = score + ' / ' + queue.length;

  let emoji, title, grade;
  if (pct >= 95) { emoji='🏆'; title='완벽해! 기말고사 준비 완료!'; grade='S등급 · 만점 수준'; }
  else if (pct >= 80) { emoji='🎉'; title='잘했어! 조금만 더!'; grade='A등급 · 우수'; }
  else if (pct >= 65) { emoji='💪'; title='절반 이상! 틀린 것만 복습하자'; grade='B등급 · 보통'; }
  else if (pct >= 50) { emoji='📚'; title='좀 더 공부가 필요해'; grade='C등급 · 부족'; }
  else { emoji='😤'; title='정리본 다시 보고 재도전!'; grade='D등급 · 재학습 필요'; }

  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-grade').textContent = grade;

  const reviewEl = document.getElementById('review-list');
  if (wrongList.length === 0) {
    reviewEl.innerHTML = '<div style="text-align:center;color:var(--green);font-size:15px;padding:12px 0;">🎯 모두 정답! 오답 없음</div>';
  } else {
    let html = `<div class="review-title">❌ 틀린 문제 (${wrongList.length}개) — 다시 확인하세요</div>`;
    wrongList.forEach(w => {
      html += `<div class="review-item">
        <div class="review-item-q">Q. ${w.title}</div>
        <div class="review-item-a">✅ 정답: ${w.answerLabel}</div>
      </div>`;
    });
    reviewEl.innerHTML = html;
  }

  res.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── 재시작 ────────────────────────────────────────────────────
function restartQuiz() {
  score = 0; answered = 0; wrongList = []; currentIdx = 0;
  isFirstRound = false;

  queue = shuffle(ALL_QUESTIONS);

  document.getElementById('result').classList.remove('show');
  document.getElementById('shuffle-badge').style.display = 'inline-flex';
  updateProgress();
  showCurrentQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── 초기 실행 ─────────────────────────────────────────────────
queue = [...ALL_QUESTIONS]; // 첫 번째 실행: 순서대로
updateProgress();
showCurrentQuestion();
</script>
